name: ci
on: [push, pull_request]
jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: test -s README.md && test -f LICENSE && test -f docs/demo.gif
      - name: README images resolve
        run: |
          grep -o '(docs/[^)]*)' README.md | tr -d '()' | while read -r f; do test -f "$f" || { echo "missing $f"; exit 1; }; done
